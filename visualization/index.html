<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>nuScenes SSL views</title>
    <link rel="icon" href="data:,">
    <style>
      :root { color-scheme: dark; font: 14px system-ui, sans-serif; background: #10151c; color: #e9eef5; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100dvh; display: flex; flex-direction: column; }
      header { padding: 16px 20px 12px; border-bottom: 1px solid #303b49; }
      h1 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
      .controls { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px 20px; }
      label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: #b5c1d0; }
      select, button { font: inherit; color: #e9eef5; background: #1c2633; border: 1px solid #455467; border-radius: 5px; min-height: 34px; padding: 5px 10px; }
      select:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #74c5ff; outline-offset: 2px; }
      button { cursor: pointer; }
      button:hover { background: #29384a; }
      button:disabled, select:disabled { opacity: .5; cursor: default; }
      .size-control { min-height: 34px; display: flex; align-items: center; gap: 8px; }
      input[type="range"] { width: 100px; accent-color: #74c5ff; }
      .mask-control { min-height: 34px; flex-direction: row; align-items: center; gap: 7px; }
      .mask-control:has(input:disabled) { opacity: .5; }
      input[type="checkbox"] { accent-color: #ff4d9b; }
      output { color: #e9eef5; min-width: 28px; }
      main { min-height: 220px; flex: 1; position: relative; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 28px; text-align: center; background: #10151ce8; white-space: pre-wrap; }
      #status[hidden] { display: none; }
      #status[data-state="error"] { color: #ffb7ac; }
      footer { padding: 10px 20px; border-top: 1px solid #303b49; color: #b5c1d0; font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
      #view-info { color: #e9eef5; }
      #sample-info { color: #95a4b7; }
      .hint { color: #95a4b7; }
      @media (max-width: 600px) { header { padding: 12px; } .controls { gap: 10px; } footer { padding: 8px 12px; } }
    </style>
    <script type="importmap">
      { "imports": { "three": "/vendor/three.module.min.js" } }
    </script>
  </head>
  <body data-ready="false">
    <header>
      <h1>nuScenes SSL views</h1>
      <div class="controls">
        <label>View
          <select id="view-select" disabled aria-label="Select a point cloud view"></select>
        </label>
        <label>Coordinates
          <select id="frame-select" disabled>
            <option value="coord">Augmented input</option>
            <option value="origin_coord">Original positions</option>
          </select>
        </label>
        <label>Point size
          <span class="size-control"><input id="point-size" type="range" min="1" max="6" step="0.5" value="2"><output id="point-size-value" for="point-size">2 px</output></span>
        </label>
        <label class="mask-control"><input id="show-masked" type="checkbox" checked disabled>Highlight masked features</label>
        <button id="fit-view" disabled>Fit view</button>
      </div>
    </header>
    <main id="viewport">
      <canvas id="point-cloud" aria-label="Interactive 3D point cloud"></canvas>
      <div id="status" role="status" aria-live="polite" data-state="loading">Loading point cloud views…</div>
    </main>
    <footer>
      <div id="view-info">Waiting for views.</div>
      <div id="sample-info"></div>
      <div id="mask-info"></div>
      <div id="color-info"></div>
      <div class="hint">Drag: orbit · Right drag / two fingers: pan · Scroll / pinch: zoom · Z is up. Switching views keeps the camera; use Fit view to recenter.</div>
    </footer>
    <script>
      // Also report module-loading failures, before the viewer module can run.
      window.addEventListener("error", (event) => {
        if (document.body.dataset.ready === "true") return;
        const status = document.getElementById("status");
        status.hidden = false;
        status.dataset.state = "error";
        status.textContent = "The viewer could not start. " + (event.message || "A local viewer file could not be loaded.");
      });
    </script>
    <script type="module" src="/viewer.js"></script>
  </body>
</html>
